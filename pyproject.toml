[project]
name = "scanweb"
version = "1.14.1"
description = "LAN scanner web UI (scanimage + Flask + waitress)"
requires-python = ">=3.8"
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "pillow>=7.0,<9",
]

[project.optional-dependencies]
qrcode = ["qrcode>=7.0"]   # 可选：任务页"扫码取件"二维码（纯 Python，无编译依赖）

[tool.uv]
package = false
