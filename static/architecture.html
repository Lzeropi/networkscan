<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScanWeb v1.14 系统架构</title>
<style>
/* ===== CSS 变量：深色主题（默认） ===== */
:root[data-theme="dark"] {
  --bg: #0f0f1a;
  --bg-canvas: #141428;
  --bg-node: #1a1a2e;
  --bg-panel: #16213e;
  --text: #e0e0e0;
  --text-dim: #8888aa;
  --text-bright: #ffffff;
  --border: #2a2a4a;
  --grid-line: #1a1a3a;
  --connection: #4a4a6a;
  --highlight: #e94560;
  --hover-glow: rgba(233,69,96,0.3);
  --dim-opacity: 0.2;
  --kind-frontend-bg: #1a1a2e; --kind-frontend-border: #e94560;
  --kind-backend-bg: #16213e;  --kind-backend-border: #06d6a0;
  --kind-database-bg: #0d1b2a; --kind-database-border: #48bfe3;
  --kind-cache-bg: #1a1a2e;    --kind-cache-border: #f5a623;
  --kind-queue-bg: #1a1a2e;    --kind-queue-border: #a78bfa;
  --kind-external-bg: #2d1b2e; --kind-external-border: #ec4899;
  --kind-service-bg: #16213e;  --kind-service-border: #06d6a0;
  --kind-gateway-bg: #1a1a2e;  --kind-gateway-border: #f72585;
  --boundary-border: #4a4a6a;
  --boundary-bg: rgba(74,74,106,0.08);
  --toolbar-bg: #141428;
  --toolbar-border: #2a2a4a;
  --btn-bg: #1a1a2e;
  --btn-hover: #2a2a4a;
}
/* ===== CSS 变量：浅色主题 ===== */
:root[data-theme="light"] {
  --bg: #f8f9fa;
  --bg-canvas: #ffffff;
  --bg-node: #ffffff;
  --bg-panel: #f0f4ff;
  --text: #1a1a2e;
  --text-dim: #6b7280;
  --text-bright: #0f0f1a;
  --border: #e0e0e8;
  --grid-line: #f0f0f4;
  --connection: #9ca3af;
  --highlight: #3b82f6;
  --hover-glow: rgba(59,130,246,0.15);
  --dim-opacity: 0.3;
  --kind-frontend-bg: #f0f4ff; --kind-frontend-border: #3b82f6;
  --kind-backend-bg: #f0fdf4;  --kind-backend-border: #22c55e;
  --kind-database-bg: #fefce8; --kind-database-border: #eab308;
  --kind-cache-bg: #fff7ed;    --kind-cache-border: #f97316;
  --kind-queue-bg: #faf5ff;    --kind-queue-border: #8b5cf6;
  --kind-external-bg: #fdf2f8; --kind-external-border: #ec4899;
  --kind-service-bg: #f0fdf4; --kind-service-border: #14b8a6;
  --kind-gateway-bg: #fef2f2; --kind-gateway-border: #ef4444;
  --boundary-border: #cbd5e1;
  --boundary-bg: rgba(203,213,225,0.1);
  --toolbar-bg: #ffffff;
  --toolbar-border: #e0e0e8;
  --btn-bg: #f8f9fa;
  --btn-hover: #e8e8f0;
}
/* ===== 全局 ===== */
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background: var(--bg); color: var(--text); height:100vh; overflow:hidden;
  user-select: none;
}
/* ===== 工具栏 ===== */
#toolbar {
  position: fixed; top:0; left:0; right:0; height:52px; z-index:100;
  background: var(--toolbar-bg); border-bottom: 1px solid var(--toolbar-border);
  display: flex; align-items: center; gap:12px; padding: 0 16px;
}
#toolbar h1 { font-size:15px; font-weight:600; color:var(--text-bright); white-space:nowrap; }
#toolbar .spacer { flex:1; }
#search-box {
  width:200px; padding:6px 12px; border:1px solid var(--border); border-radius:6px;
  background: var(--bg-node); color: var(--text); font-size:13px; outline:none;
}
#search-box:focus { border-color: var(--highlight); }
.tb-btn {
  padding:6px 14px; border:1px solid var(--border); border-radius:6px;
  background: var(--btn-bg); color: var(--text); font-size:13px; cursor:pointer;
  transition: background .15s;
}
.tb-btn:hover { background: var(--btn-hover); }
.tb-btn.active { border-color: var(--highlight); color: var(--highlight); }
/* ===== 画布 ===== */
#canvas-wrap {
  position: fixed; top:52px; left:0; right:0; bottom:0; overflow:auto;
  background: var(--bg-canvas);
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 40px 40px;
}
#canvas-inner {
  position: relative; min-width:100%; min-height:100%; padding:48px;
  transform-origin: 0 0;
}
/* ===== 边界容器 ===== */
.boundary {
  position: absolute; border: 2px dashed var(--boundary-border);
  border-radius: 12px; background: var(--boundary-bg); padding: 24px 16px 16px;
  pointer-events: none;
}
.boundary-label {
  position: absolute; top: -10px; left: 16px; padding: 2px 12px;
  background: var(--bg-canvas); font-size: 12px; color: var(--text-dim);
  border-radius: 4px; pointer-events: none;
}
/* ===== 节点 ===== */
.node {
  position: absolute; min-width: 140px; max-width: 220px;
  padding: 12px 16px; border-radius: 8px; border: 2px solid;
  background: var(--bg-node); cursor: pointer; text-align: center;
  transition: box-shadow .15s, opacity .2s, transform .15s;
  z-index: 10;
}
.node .node-icon { font-size: 20px; margin-bottom: 4px; }
.node .node-label { font-size: 13px; font-weight: 600; color: var(--text-bright); }
.node .node-kind { font-size: 11px; color: var(--text-dim); margin-top: 2px; text-transform: uppercase; }
.node[data-kind="frontend"]  { border-color: var(--kind-frontend-border); background: var(--kind-frontend-bg); }
.node[data-kind="backend"]   { border-color: var(--kind-backend-border);  background: var(--kind-backend-bg); }
.node[data-kind="database"]  { border-color: var(--kind-database-border); background: var(--kind-database-bg); border-radius: 8px; }
.node[data-kind="cache"]     { border-color: var(--kind-cache-border);    background: var(--kind-cache-bg); }
.node[data-kind="queue"]     { border-color: var(--kind-queue-border);    background: var(--kind-queue-bg); }
.node[data-kind="external"]  { border-color: var(--kind-external-border); background: var(--kind-external-bg); }
.node[data-kind="service"]   { border-color: var(--kind-service-border);  background: var(--kind-service-bg); }
.node[data-kind="gateway"]   { border-color: var(--kind-gateway-border);  background: var(--kind-gateway-bg); }
.node:hover { box-shadow: 0 0 16px var(--hover-glow); transform: translateY(-2px); }
.node.highlighted { box-shadow: 0 0 20px var(--hover-glow); border-width: 3px; }
.node.dimmed { opacity: var(--dim-opacity); }
.node.matched { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 8px var(--highlight)} 50%{box-shadow:0 0 24px var(--highlight)} }
/* ===== SVG 连线 ===== */
#svg-layer {
  position: absolute; top:0; left:0; width:100%; height:100%;
  pointer-events: none; z-index: 5; overflow: visible;
}
.conn-path {
  fill: none; stroke: var(--connection); stroke-width: 2;
  transition: stroke .2s, stroke-width .2s, opacity .2s;
}
.conn-path.highlight { stroke: var(--highlight); stroke-width: 3; }
.conn-path.dimmed { opacity: var(--dim-opacity); }
.conn-label {
  fill: var(--text-dim); font-size: 11px; text-anchor: middle;
  transition: opacity .2s;
}
.conn-label.dimmed { opacity: var(--dim-opacity); }
.conn-label.highlight { fill: var(--highlight); font-weight: 600; }
/* ===== 详情面板 ===== */
#detail-panel {
  position: fixed; top:52px; right:0; bottom:0; width:320px; z-index:50;
  background: var(--bg-panel); border-left: 1px solid var(--border);
  transform: translateX(100%); transition: transform .25s; padding: 20px;
  overflow-y: auto;
}
#detail-panel.open { transform: translateX(0); }
#detail-panel .dp-title { font-size:16px; font-weight:700; color:var(--text-bright); margin-bottom:12px; }
#detail-panel .dp-kind { font-size:12px; color:var(--text-dim); text-transform:uppercase; margin-bottom:16px; }
#detail-panel .dp-desc { font-size:13px; line-height:1.6; color:var(--text); margin-bottom:16px; }
#detail-panel .dp-section { margin-bottom:16px; }
#detail-panel .dp-section h3 { font-size:12px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; }
#detail-panel .dp-rel { display:flex; align-items:center; gap:6px; font-size:13px; padding:4px 0; }
#detail-panel .dp-rel .arrow { color:var(--text-dim); }
#detail-panel .dp-close { position:absolute; top:12px; right:16px; cursor:pointer; font-size:20px; color:var(--text-dim); }
#detail-panel .dp-close:hover { color:var(--text-bright); }
/* ===== 图例 ===== */
#legend {
  position: fixed; bottom:16px; left:16px; z-index:40;
  background: var(--toolbar-bg); border:1px solid var(--toolbar-border);
  border-radius: 8px; padding: 12px 16px; font-size: 11px;
}
#legend .lg-title { font-weight:600; margin-bottom:6px; color:var(--text-dim); }
#legend .lg-item { display:inline-flex; align-items:center; gap:4px; margin-right:12px; }
#legend .lg-dot { width:10px; height:10px; border-radius:3px; border:2px solid; }
</style>
</head>
<body>
<div id="toolbar">
  <h1 id="diagram-title">架构图</h1>
  <div class="spacer"></div>
  <input type="text" id="search-box" placeholder="搜索节点..." />
  <button class="tb-btn" id="btn-theme" onclick="toggleTheme()">☀ 浅色</button>
  <button class="tb-btn" id="btn-export-svg" onclick="exportSVG()">导出 SVG</button>
  <button class="tb-btn" id="btn-export-png" onclick="exportPNG()">导出 PNG</button>
  <button class="tb-btn" id="btn-reset" onclick="resetView()">重置视图</button>
</div>

<div id="canvas-wrap" onwheel="handleWheel(event)" onmousedown="startPan(event)">
  <div id="canvas-inner">
    <svg id="svg-layer"></svg>
    <!-- 节点和边界由 JS 动态生成 -->
  </div>
</div>

<div id="detail-panel">
  <span class="dp-close" onclick="closeDetail()">✕</span>
  <div class="dp-title" id="dp-title"></div>
  <div class="dp-kind" id="dp-kind"></div>
  <div class="dp-desc" id="dp-desc"></div>
  <div class="dp-section" id="dp-connections"></div>
  <div class="dp-section" id="dp-metadata"></div>
</div>

<div id="legend">
  <div class="lg-title">组件类型</div>
  <span class="lg-item"><span class="lg-dot" style="border-color:var(--kind-frontend-border)"></span>前端</span>
  <span class="lg-item"><span class="lg-dot" style="border-color:var(--kind-gateway-border)"></span>网关</span>
  <span class="lg-item"><span class="lg-dot" style="border-color:var(--kind-backend-border)"></span>后端</span>
  <span class="lg-item"><span class="lg-dot" style="border-color:var(--kind-cache-border)"></span>缓存</span>
  <span class="lg-item"><span class="lg-dot" style="border-color:var(--kind-database-border)"></span>数据库</span>
  <span class="lg-item"><span class="lg-dot" style="border-color:var(--kind-external-border)"></span>外部</span>
</div>

<script>
/* ===== JSON IR 数据（ScanWeb v1.14，archify 生成） ===== */
const IR = {
  "diagram_type": "architecture",
  "meta": {
    "title": "ScanWeb v1.14 系统架构",
    "locale": "zh-CN",
    "theme": "dark",

      "kind": "backend",
      "description": "PIN 认证（v1.14：PBKDF2 200k 慢哈希 + 旧格式自动迁移 + 按 IP 防暴力锁）、资源监控、环境检测、配置读写、任务锁定管理。scan_root 系统目录黑名单；scan_defaults 按设备能力白名单校验"
    },
    {
      "id": "scanner",
      "label": "scanner.py 扫描核心",
      "kind": "backend",
      "description": "scan_lock 全局独占锁（平板/ADF 互斥）；state 状态机（v1.14：平板扫描+后台转换全程可见，扫描期间删除/排序/清理全部拦截）；PNM→PNG 后台转换不阻塞下次扫描；设备名解析缓存按后端分键（v1.14）；ADF 进纸源白名单校验"
    },
    {
      "id": "jobsm",
      "label": "jobs.py 任务管理",
      "kind": "backend",
      "description": "任务创建/元数据/页列表/物理排序重编号。v1.14：pages() 过滤 0 字节转换中占位、raw_pages() 裸计数防编号冲突；cleanup 排除扫描中任务；锁定任务三层防护兜底"
    },
    {
      "id": "dp",
      "label": "device_probe.py 设备探测",
      "kind": "service",
      "description": "v1.14 新增公共模块：scanimage -L/-A 解析设备能力（模式/进纸源/DPI 列表），普通页与管理页共用同一实现与 300s 缓存，统一 25s 超时"
    },
    {
      "id": "config",
      "label": "config.py 配置中心",
      "kind": "service",
      "description": "环境变量（端口/存储路径/页数与内存上限）+ admin_config.json 运行配置（PIN/别名/默认值/清理策略），原子写入"
    },
    {
      "id": "fs",
      "label": "文件存储 scan_root",
      "kind": "database",
      "description": "每任务一个目录：meta.json + pNNN.png 页面 + .thumbs 缩略图。零数据库，Samba 可直接共享给局域网"
    },
    {
      "id": "scanimage",
      "label": "SANE scanimage",
      "kind": "external",
      "description": "扫描命令行工具，持锁执行（平板单页 300s 超时 / ADF 批量 3600s），短设备名自动解析完整名"
    },
    {
      "id": "convert",
      "label": "ImageMagick convert",
      "kind": "external",
      "description": "PNM→PNG 转换（hpljm1005 后端不支持直接输出 PNG），后台线程执行不阻塞扫描仪"
    },

      "id": "scanner_dev",

    },
    {
      "id": "systemd",
      "label": "systemd + webscan CLI",
      "kind": "service",
      "description": "Restart=always 自动拉起；webscan update 一键更新（v1.14 原子化：先解压校验→mv 切换→启动验证→失败自动回滚）"
    }
  ],
  "boundaries": [
    {
      "id": "lan",
      "label": "局域网客户端",
      "members": [
        "browser"
      ]
    },
    {
      "id": "box",
      "label": "盒子主机（hi3798mv100 / Ubuntu 20.04）",
      "members": [
        "waitress",
        "app",
        "admin_bp",
        "scanner",
        "jobsm",
        "dp",
        "config",
        "fs",
        "scanimage",
        "convert",
        "scanner_dev",
        "systemd"
      ]
    }
  ],
  "connections": [
    {
      "from": "browser",
      "to": "waitress",
      "label": "HTTP :9203",
      "highlight": true
    },
    {
      "from": "waitress",
      "to": "app",
      "label": "WSGI",
      "highlight": true
    },
    {
      "from": "waitress",
      "to": "admin_bp",
      "label": "Blueprint"
    },
    {
      "from": "app",
      "to": "scanner",
      "label": "scan / status",
      "highlight": true
    },
    {
      "from": "app",
      "to": "jobsm",
      "label": "任务 CRUD"
    },
    {
      "from": "app",
      "to": "dp",
      "label": "probe()"
    },
    {
      "from": "admin_bp",
      "to": "scanner",
      "label": "testscan / state"
    },
    {
      "from": "admin_bp",
      "to": "jobsm",
      "label": "列表 / 锁定"
    },
    {
      "from": "admin_bp",
      "to": "dp",
      "label": "probe(refresh)"
    },
    {
      "from": "admin_bp",
      "to": "config",
      "label": "配置读写",
      "highlight": true
    },
    {
      "from": "scanner",
      "to": "jobsm",
      "label": "pages / save"
    },
    {
      "from": "scanner",
      "to": "scanimage",
      "label": "subprocess 持锁",
      "highlight": true
    },
    {
      "from": "scanner",
      "to": "convert",
      "label": "PNM→PNG"
    },
    {
      "from": "jobsm",
      "to": "fs",
      "label": "meta / 页面"
    },
    {
      "from": "scanimage",
      "to": "scanner_dev",
      "label": "USB SANE",
      "highlight": true
    },
    {
      "from": "convert",
      "to": "fs",
      "label": "写 PNG"
    },
    {
      "from": "config",
      "to": "fs",
      "label": "admin_config.json"
    },
    {
      "from": "systemd",
      "to": "waitress",
      "label": "启停 / 自愈"
    }
  ]
};

/* ===== 布局配置 ===== */
const LAYER_ORDER = ['frontend','gateway','service','backend','cache','queue','database','external'];
const NODE_W = 160, NODE_H = 64, GAP_X = 60, GAP_Y = 120, MARGIN = 48;

/* ===== 状态 ===== */
let nodePositions = {};
let scale = 1, panX = 0, panY = 0;
let isPanning = false, panStart = { x:0, y:0, px:0, py:0 };

/* ===== 图标映射 ===== */
const KIND_ICONS = {
  frontend:'🖥️', backend:'⚙️', database:'🗄️', cache:'⚡',
  queue:'📨', external:'🔗', service:'🔧', gateway:'🚪'
};

/* ===== 渲染入口 ===== */
function render() {
  document.getElementById('diagram-title').textContent = IR.meta.title;
  document.documentElement.setAttribute('data-theme', IR.meta.theme || 'dark');
  layoutNodes();
  renderBoundaries();
  renderNodes();
  renderConnections();
  updateTransform();
}

/* ===== 自动布局：按 kind 分层 ===== */
function layoutNodes() {
  nodePositions = {};
  const layers = {};
  IR.components.forEach(c => {
    const layerIdx = LAYER_ORDER.indexOf(c.kind);
    const key = layerIdx >= 0 ? layerIdx : 99;
    if (!layers[key]) layers[key] = [];
    layers[key].push(c);
  });
  const sortedKeys = Object.keys(layers).sort((a,b)=>a-b);
  sortedKeys.forEach((key, rowIdx) => {
    const layer = layers[key];
    layer.forEach((comp, colIdx) => {
      nodePositions[comp.id] = {
        x: MARGIN + colIdx * (NODE_W + GAP_X),
        y: MARGIN + rowIdx * (NODE_H + GAP_Y),
        w: NODE_W,
        h: NODE_H
      };
    });
  });
}

/* ===== 渲染边界 ===== */
function renderBoundaries() {
  const canvas = document.getElementById('canvas-inner');
  if (!IR.boundaries) return;
  IR.boundaries.forEach(b => {
    const members = b.members.map(id => nodePositions[id]).filter(Boolean);
    if (members.length === 0) return;
    const minX = Math.min(...members.map(m=>m.x)) - 20;
    const minY = Math.min(...members.map(m=>m.y)) - 20;
    const maxX = Math.max(...members.map(m=>m.x+m.w)) + 20;
    const maxY = Math.max(...members.map(m=>m.y+m.h)) + 20;
    const div = document.createElement('div');
    div.className = 'boundary';
    div.style.cssText = `left:${minX}px;top:${minY}px;width:${maxX-minX}px;height:${maxY-minY}px;`;
    div.innerHTML = `<span class="boundary-label">${b.label}</span>`;
    canvas.insertBefore(div, document.getElementById('svg-layer'));
  });
}

/* ===== 渲染节点 ===== */
function renderNodes() {
  const canvas = document.getElementById('canvas-inner');
  IR.components.forEach(c => {
    const pos = nodePositions[c.id];
    if (!pos) return;
    const div = document.createElement('div');
    div.className = 'node';
    div.id = 'node-' + c.id;
    div.dataset.kind = c.kind;
    div.dataset.id = c.id;
    div.style.cssText = `left:${pos.x}px;top:${pos.y}px;width:${pos.w}px;`;
    div.innerHTML = `
      <div class="node-icon">${KIND_ICONS[c.kind]||'📦'}</div>
      <div class="node-label">${c.label}</div>
      <div class="node-kind">${c.kind}</div>`;
    div.addEventListener('mouseenter', () => highlightNode(c.id));
    div.addEventListener('mouseleave', () => clearHighlight());
    div.addEventListener('click', () => showDetail(c.id));
    canvas.appendChild(div);
  });
}

/* ===== 渲染连线 ===== */
function renderConnections() {
  const svg = document.getElementById('svg-layer');
  svg.innerHTML = '';
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--connection)" /></marker>
    <marker id="arrow-hl" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="var(--highlight)" /></marker>`;
  svg.appendChild(defs);

  IR.connections.forEach((conn, idx) => {
    const from = nodePositions[conn.from];
    const to = nodePositions[conn.to];
    if (!from || !to) return;
    const x1 = from.x + from.w/2, y1 = from.y + from.h;
    const x2 = to.x + to.w/2, y2 = to.y;
    const midY = (y1 + y2) / 2;
    const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', d);
    path.setAttribute('class', 'conn-path' + (conn.highlight ? ' highlight' : ''));
    path.setAttribute('marker-end', conn.highlight ? 'url(#arrow-hl)' : 'url(#arrow)');
    path.id = 'conn-' + idx;
    if (conn.style === 'dashed') path.setAttribute('stroke-dasharray', '6,4');
    svg.appendChild(path);

    if (conn.label) {
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x', (x1+x2)/2);
      text.setAttribute('y', midY - 4);
      text.setAttribute('class', 'conn-label' + (conn.highlight ? ' highlight' : ''));
      text.textContent = conn.label;
      svg.appendChild(text);
    }
  });
}

/* ===== 交互：Hover 高亮 ===== */
function highlightNode(id) {
  const related = new Set([id]);
  IR.connections.forEach(c => {
    if (c.from === id) related.add(c.to);
    if (c.to === id) related.add(c.from);
  });
  document.querySelectorAll('.node').forEach(n => {
    if (related.has(n.dataset.id)) n.classList.add('highlighted');
    else n.classList.add('dimmed');
  });
  document.querySelectorAll('.conn-path, .conn-label').forEach((el, i) => {
    const conn = IR.connections[Math.floor(i/1)];
    // 简化：高亮与该节点相关的连线
  });
  IR.connections.forEach((c, i) => {
    const path = document.getElementById('conn-' + i);
    if (!path) return;
    if (c.from === id || c.to === id) { path.classList.remove('dimmed'); path.classList.add('highlight'); }
    else { path.classList.add('dimmed'); }
  });
}
function clearHighlight() {
  document.querySelectorAll('.node').forEach(n => { n.classList.remove('highlighted','dimmed'); });
  document.querySelectorAll('.conn-path').forEach(p => {
    p.classList.remove('dimmed');
    if (!IR.connections[parseInt(p.id.replace('conn-',''))]?.highlight) p.classList.remove('highlight');
  });
  document.querySelectorAll('.conn-label').forEach(l => { l.classList.remove('dimmed'); });
}

/* ===== 交互：详情面板 ===== */
function showDetail(id) {
  const comp = IR.components.find(c => c.id === id);
  if (!comp) return;
  document.getElementById('dp-title').textContent = comp.label;
  document.getElementById('dp-kind').textContent = comp.kind;
  document.getElementById('dp-desc').textContent = comp.description || '无描述';

  const upstream = IR.connections.filter(c => c.to === id).map(c => {
    const src = IR.components.find(x => x.id === c.from);
    return `<div class="dp-rel"><span>←</span><span style="color:var(--highlight)">${src?.label||c.from}</span><span class="arrow">→</span><span>${c.label||''}</span></div>`;
  }).join('');
  const downstream = IR.connections.filter(c => c.from === id).map(c => {
    const tgt = IR.components.find(x => x.id === c.to);
    return `<div class="dp-rel"><span>${c.label||''}</span><span class="arrow">→</span><span style="color:var(--highlight)">${tgt?.label||c.to}</span></div>`;
  }).join('');
  document.getElementById('dp-connections').innerHTML = `
    <h3>上游依赖</h3>${upstream||'<div style="color:var(--text-dim)">无</div>'}
    <h3 style="margin-top:12px">下游调用</h3>${downstream||'<div style="color:var(--text-dim)">无</div>'}`;

  if (comp.metadata) {
    const meta = Object.entries(comp.metadata).map(([k,v]) => `<div style="font-size:13px"><strong>${k}:</strong> ${v}</div>`).join('');
    document.getElementById('dp-metadata').innerHTML = `<h3>元数据</h3>${meta}`;
  } else {
    document.getElementById('dp-metadata').innerHTML = '';
  }
  document.getElementById('detail-panel').classList.add('open');
}
function closeDetail() { document.getElementById('detail-panel').classList.remove('open'); }

/* ===== 交互：搜索 ===== */
document.getElementById('search-box').addEventListener('input', function(e) {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { document.querySelectorAll('.node').forEach(n => n.classList.remove('matched')); return; }
  IR.components.forEach(c => {
    const el = document.getElementById('node-' + c.id);
    if (!el) return;
    if (c.label.toLowerCase().includes(q) || c.kind.toLowerCase().includes(q) || c.id.toLowerCase().includes(q)) {
      el.classList.add('matched');
    } else {
      el.classList.remove('matched');
    }
  });
});

/* ===== 交互：缩放平移 ===== */
function handleWheel(e) {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  scale = Math.max(0.5, Math.min(3, scale * delta));
  updateTransform();
}
function startPan(e) {
  if (e.target.closest('.node') || e.target.closest('.boundary')) return;
  isPanning = true;
  panStart = { x: e.clientX, y: e.clientY, px: panX, py: panY };
  document.addEventListener('mousemove', doPan);
  document.addEventListener('mouseup', endPan);
}
function doPan(e) {
  if (!isPanning) return;
  panX = panStart.px + (e.clientX - panStart.x);
  panY = panStart.py + (e.clientY - panStart.y);
  updateTransform();
}
function endPan() { isPanning = false; document.removeEventListener('mousemove', doPan); document.removeEventListener('mouseup', endPan); }
function updateTransform() {
  document.getElementById('canvas-inner').style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
}
function resetView() { scale=1; panX=0; panY=0; updateTransform(); }

/* ===== 交互：主题切换 ===== */
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('btn-theme').textContent = next === 'dark' ? '☀ 浅色' : '🌙 深色';
  renderConnections(); // 重绘连线以更新箭头颜色
}

/* ===== 导出：SVG ===== */
function exportSVG() {
  const svg = document.getElementById('svg-layer');
  const serializer = new XMLSerializer();
  const svgStr = serializer.serializeToString(svg);
  const blob = new Blob(['<?xml version="1.0"?>\n', svgStr], { type: 'image/svg+xml' });
  downloadBlob(blob, (IR.meta.title || 'archify') + '.svg');
}

/* ===== 导出：PNG ===== */
function exportPNG() {
  const canvas = document.getElementById('canvas-inner');
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  const pngCanvas = document.createElement('canvas');
  pngCanvas.width = w * 2; pngCanvas.height = h * 2; // 2x 分辨率
  const ctx = pngCanvas.getContext('2d');
  ctx.fillStyle = getComputedStyle(document.body).backgroundColor;
  ctx.fillRect(0, 0, pngCanvas.width, pngCanvas.height);
  // 绘制节点
  IR.components.forEach(c => {
    const pos = nodePositions[c.id]; if (!pos) return;
    const el = document.getElementById('node-' + c.id); if (!el) return;
    const style = getComputedStyle(el);
    const x = pos.x * 2, y = pos.y * 2, w2 = pos.w * 2;
    ctx.fillStyle = style.backgroundColor;
    ctx.strokeStyle = style.borderColor;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(x, y, w2, NODE_H * 2, 8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = style.color;
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(c.label, x + w2/2, y + NODE_H * 2 / 2 + 8);
  });
  // 绘制连线
  ctx.strokeStyle = '#4a4a6a';
  ctx.lineWidth = 3;
  IR.connections.forEach(conn => {
    const from = nodePositions[conn.from], to = nodePositions[conn.to];
    if (!from || !to) return;
    const x1 = (from.x + from.w/2)*2, y1 = (from.y + from.h)*2;
    const x2 = (to.x + to.w/2)*2, y2 = (to.y)*2;
    const midY = (y1+y2)/2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(x1, midY, x2, midY, x2, y2);
    ctx.stroke();
  });
  pngCanvas.toBlob(blob => downloadBlob(blob, (IR.meta.title||'archify')+'.png'), 'image/png');
}

/* ===== 工具函数 ===== */
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ===== 初始化 ===== */
render();
</script>
